<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scheduler — Test client</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 560px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.hint { font-size: 0.9rem; color: #555; margin-top: 0; }
    label { display: block; margin: 1.25rem 0 0.3rem; font-weight: 600; }
    label span { font-weight: normal; font-size: 0.85rem; color: #666; }
    input[type="number"] { width: 5rem; padding: 0.3rem 0.4rem; font-size: 1rem; }
    input[type="file"] { display: block; }
    button {
      margin-top: 1.75rem;
      padding: 0.5rem 1.75rem;
      font-size: 1rem;
      cursor: pointer;
      background: #0969da;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    button:disabled { background: #8ab4e8; cursor: not-allowed; }
    #status {
      margin-top: 1.25rem;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      font-size: 0.95rem;
      display: none;
    }
    #status.ok  { background: #d4edda; color: #155724; display: block; }
    #status.err { background: #f8d7da; color: #721c24; display: block; }
    #status.inf { background: #e2e3e5; color: #383d41; display: block; }
  </style>
</head>
<body>
  <h1>Scheduler — Test client</h1>
  <p class="hint">
    Remplissez le formulaire puis cliquez sur <strong>Planifier</strong>.<br>
    Le payload et la réponse complète apparaîtront dans la <strong>console du navigateur</strong> (F12).
  </p>

  <form id="schedule-form">
    <label for="week">
      Semaine
      <span>(numéro ISO, ex. 47)</span>
    </label>
    <input type="number" id="week" name="week" min="1" max="53" placeholder="47" required />

    <label for="resources-file">
      Resources
      <span>(JSON — <code>ResourceGroupData[]</code>)</span>
    </label>
    <input type="file" id="resources-file" accept=".json" required />

    <label for="courses-file">
      Cours
      <span>(JSON — objet avec propriété <code>courses: CourseTaskData[]</code>)</span>
    </label>
    <input type="file" id="courses-file" accept=".json" required />

    <label for="constraints-file">
      Contraintes
      <span>(JSON — <code>ConstraintsData</code>, optionnel)</span>
    </label>
    <input type="file" id="constraints-file" accept=".json" />

    <button type="submit" id="submit-btn">Planifier</button>
  </form>

  <p id="status"></p>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
